<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NASA Space Explorer</title>
  <!-- Inter and Public Sans are the typefaces used in NASA's brand and web design system -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Public+Sans:wght@400;600&display=swap" rel="stylesheet" />
  <link href="style.css" rel="stylesheet" type="text/css" />
</head>
<body>
  <div class="container">
    <header class="site-header">
      <img src="img/nasa-worm-logo.png" alt="NASA Logo" class="logo" />
      <h1>Space Explorer</h1>
    </header>

    <p class="intro">Pick a start date to see nine days of NASA's Astronomy Picture of the Day.</p>

    <div class="filters">
      <label>
        <span>Start date</span>
        <input type="date" id="startDate" />
      </label>
      <label>
        <span>End date</span>
        <input type="date" id="endDate" />
      </label>
      <button id="getImages">Get Space Images</button>
    </div>

    <!-- LevelUp: random space fact, chosen in script.js on each page load -->
    <aside class="fact" aria-live="polite">
      <h2>🚀 Did You Know?</h2>
      <p id="factText"></p>
    </aside>

    <main id="gallery" class="gallery">
      <div class="placeholder">
        <div class="placeholder-icon">🔭</div>
        <p>Select a date range and click "Get Space Images" to explore the cosmos!</p>
      </div>
    </main>
  </div>

  <!-- Modal: filled in by script.js when a gallery item is clicked -->
  <dialog id="modal" class="modal" aria-labelledby="modalTitle">
    <button id="modalClose" class="modal-close" aria-label="Close">&times;</button>
    <div id="modalMedia" class="modal-media"></div>
    <div class="modal-text">
      <h2 id="modalTitle"></h2>
      <p id="modalDate" class="modal-date"></p>
      <p id="modalExplanation"></p>
      <p id="modalCredit" class="modal-credit"></p>
    </div>
  </dialog>

  <footer class="site-footer">
    Images and text from <a href="https://apod.nasa.gov/apod/" target="_blank" rel="noopener">NASA APOD</a>.
    Student project, not an official NASA site.
  </footer>

  <script src="js/dateRange.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
